# Builds the Windows setup (afrosetup-v<app/VERSION>.exe) and its source asset
# (afrosetup-v<app/VERSION>-files.bin, which the setup downloads) on GitHub Actions.
# Started by hand only (Actions tab > Setup build > Run workflow, or
# `gh workflow run setup.yml -f ref=v0.3.12`). It never runs on push.
#
# Every run uploads both files as a workflow artifact and records a build
# provenance attestation for them (`gh attestation verify <file> -R LomoXSoft/AfroSamuraiRecomp`).
# With "upload" ticked it also attaches both to the GitHub release of that
# tag, but only while the release is still a draft. A published release is never
# changed by this workflow.
name: Setup build

on:
  workflow_dispatch:
    inputs:
      ref:
        description: Tag or commit to build (for example v0.3.12)
        required: true
        type: string
      upload:
        description: Attach the setup to that tag's draft release
        required: false
        type: boolean
        default: false

permissions: {}

env:
  # Same LLVM as install.ps1 ($DOWNLOADS.llvm) and the local release builds.
  LLVM_URL: https://github.com/llvm/llvm-project/releases/download/llvmorg-20.1.8/clang%2Bllvm-20.1.8-x86_64-pc-windows-msvc.tar.xz
  LLVM_SHA256: f229769f11d6a6edc8ada599c0cda964b7dee6ab1a08c6cf9dd7f513e85b107f
  LLVM_DIR: clang+llvm-20.1.8-x86_64-pc-windows-msvc

jobs:
  build:
    # windows-2022 has Visual Studio 2022 (MSVC 14.44). windows-2025 has Visual
    # Studio 18 with MSVC 14.52, whose C++ library refuses Clang 20 (STL1000),
    # the same reason install.ps1 pins MSVC 14.51.
    runs-on: windows-2022
    permissions:
      contents: write      # only used by the draft release upload
      id-token: write      # build provenance attestation
      attestations: write
    steps:
      # ci: this workflow's own commit (build script). src: the ref to build,
      # so tags made before the build script existed can be built too.
      - name: Check out the build script
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: ci
          persist-credentials: false

      - name: Check out the ref to build
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref }}
          path: src
          persist-credentials: false

      - name: Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'

      - name: LLVM cache
        id: llvm-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}\llvm
          key: llvm-20.1.8-${{ env.LLVM_SHA256 }}-setup-subset

      - name: Download LLVM 20.1.8
        if: steps.llvm-cache.outputs.cache-hit != 'true'
        shell: pwsh
        run: |
          $ProgressPreference = 'SilentlyContinue'
          $file = Join-Path $env:RUNNER_TEMP 'llvm.tar.xz'
          Invoke-WebRequest -Uri $env:LLVM_URL -OutFile $file
          $hash = (Get-FileHash -Algorithm SHA256 $file).Hash.ToLowerInvariant()
          if ($hash -ne $env:LLVM_SHA256) { throw "LLVM archive hash $hash does not match $env:LLVM_SHA256" }
          # Only what the setup build needs: clang, llvm-rc and the compiler headers.
          $out = Join-Path $env:RUNNER_TEMP 'llvm'
          $p = $env:LLVM_DIR
          cmd /c "7z x -so `"$file`" | 7z x -si -ttar -y -bd `"-o$out`" `"$p\bin\clang.exe`" `"$p\bin\clang++.exe`" `"$p\bin\llvm-rc.exe`" `"$p\lib\clang\20\include`""
          if ($LASTEXITCODE -ne 0) { throw "7z failed with exit code $LASTEXITCODE" }
          Remove-Item -Force $file

      - name: Put LLVM on PATH
        shell: pwsh
        run: |
          $bin = Join-Path $env:RUNNER_TEMP "llvm\$env:LLVM_DIR\bin"
          if (-not (Test-Path (Join-Path $bin 'clang++.exe'))) { throw "clang++.exe missing in $bin" }
          Add-Content -Path $env:GITHUB_PATH -Value $bin

      - name: Build the setup
        id: build
        shell: pwsh
        run: |
          $dist = Join-Path $env:GITHUB_WORKSPACE 'dist'
          $vs = Get-ChildItem 'C:\Program Files\Microsoft Visual Studio\*\*\VC\Tools\MSVC' -Directory -ErrorAction SilentlyContinue
          Write-Host "MSVC toolsets: $(($vs | Get-ChildItem -Directory | ForEach-Object Name) -join ', ')"
          ./ci/tools/build_release_setup.ps1 -Repo src -Ref HEAD -OutDir $dist
          $exe = Get-ChildItem $dist -Filter 'afrosetup-v*.exe' | Select-Object -First 1
          if (-not $exe) { throw 'no setup was built' }
          $files = Get-ChildItem $dist -Filter 'afrosetup-v*-files.bin' | Select-Object -First 1
          if (-not $files) { throw 'no source asset was built' }
          $hash = (Get-FileHash -Algorithm SHA256 $exe.FullName).Hash.ToLowerInvariant()
          $filesHash = (Get-FileHash -Algorithm SHA256 $files.FullName).Hash.ToLowerInvariant()
          @("$hash *$($exe.Name)", "$filesHash *$($files.Name)") | Set-Content -Encoding ascii (Join-Path $dist 'SHA256SUMS.txt')
          "name=$($exe.Name)" | Add-Content -Path $env:GITHUB_OUTPUT
          "path=$($exe.FullName)" | Add-Content -Path $env:GITHUB_OUTPUT
          "files_path=$($files.FullName)" | Add-Content -Path $env:GITHUB_OUTPUT
          $commit = git -C src rev-parse HEAD
          @(
            "### $($exe.Name)",
            '',
            "- Built from: ``$env:REF`` (commit ``$commit``)",
            "- Size: $($exe.Length) bytes",
            "- SHA-256: ``$hash``",
            "- $($files.Name): $($files.Length) bytes, SHA-256 ``$filesHash``"
          ) | Add-Content -Path $env:GITHUB_STEP_SUMMARY
        env:
          REF: ${{ inputs.ref }}

      - name: Run the packaging check
        shell: pwsh
        run: |
          # The check of the built ref, which knows that ref's version.
          Copy-Item -Force $env:EXE (Join-Path $env:GITHUB_WORKSPACE 'src/tools')
          if ($env:FILES) { Copy-Item -Force $env:FILES (Join-Path $env:GITHUB_WORKSPACE 'src/tools') }
          python src/checks/check_setup_packaging.py
          if ($LASTEXITCODE -ne 0) { throw 'check_setup_packaging.py failed' }
        env:
          EXE: ${{ steps.build.outputs.path }}
          FILES: ${{ steps.build.outputs.files_path }}

      - name: Attest build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            ${{ steps.build.outputs.path }}
            ${{ steps.build.outputs.files_path }}

      - name: Upload artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ steps.build.outputs.name }}
          path: |
            dist/afrosetup-v*.exe
            dist/afrosetup-v*-files.bin
            dist/SHA256SUMS.txt
          if-no-files-found: error

      - name: Attach to the draft release
        if: inputs.upload
        shell: pwsh
        run: |
          $draft = gh release view $env:REF -R $env:GITHUB_REPOSITORY --json isDraft --jq .isDraft
          if ($LASTEXITCODE -ne 0) { throw "no GitHub release for $env:REF" }
          if ($draft -ne 'true') { throw "release $env:REF is already published; this workflow only uploads to drafts" }
          gh release upload $env:REF $env:EXE $env:FILES -R $env:GITHUB_REPOSITORY --clobber
          if ($LASTEXITCODE -ne 0) { throw 'gh release upload failed' }
        env:
          GH_TOKEN: ${{ github.token }}
          REF: ${{ inputs.ref }}
          EXE: ${{ steps.build.outputs.path }}
          FILES: ${{ steps.build.outputs.files_path }}
